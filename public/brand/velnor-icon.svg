<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <!--
    Velnor mark, in vectolith-icon.svg's drafting language: 500 grid, stroked facets
    with round joins, two colours only, and the same prefers-color-scheme swap.
    Not the same monument. Vectolith is a hexagonal prism with a spine and a diamond
    core; Velnor is a rotor, three blades turning around a diamond void. Restraint
    and vocabulary are shared, the figure is not.
  -->
  <style>
    .velnor-line {
      stroke: #0A0A0A;
      stroke-width: 18;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .velnor-core { fill: #0A0A0A; fill-opacity: 0.12; }
    @media (prefers-color-scheme: dark) {
      .velnor-line { stroke: #F4F3F1; }
      .velnor-core { fill: #F4F3F1; fill-opacity: 0.18; }
    }
  </style>

  <!-- Diamond void the blades turn around -->
  <polygon class="velnor-line" points="250,164 336,250 250,336 164,250" />

  <!-- Three faceted blades, each twisted against its own sweep -->
  <polygon class="velnor-line" points="152.0,80.3 348.0,80.3 258.8,166.5 182.0,200.6" />
  <polygon class="velnor-line" points="446.0,250.0 348.0,419.7 318.0,299.4 326.7,215.8" />
  <polygon class="velnor-line" points="152.0,419.7 54.0,250.0 173.3,284.2 241.2,333.5" />

  <!-- Core, echoing the small filled diamond at the heart of the Vectolith mark -->
  <polygon class="velnor-core" points="250,222 278,250 250,278 222,250" />
</svg>
