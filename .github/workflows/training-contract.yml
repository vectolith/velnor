name: Training contract

on:
  pull_request:
    paths:
      - "training/**"
      - ".github/workflows/training-contract.yml"
  push:
    branches: [main]
    paths:
      - "training/**"
      - ".github/workflows/training-contract.yml"

permissions:
  contents: read

jobs:
  training-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile training and evaluation entrypoints
        working-directory: training
        run: |
          python -m py_compile foundation_config.py family_runtime.py train_selected_adapter.py
          python -m py_compile train_velnor_lora.py train_qwen3_8b_qlora.py train_core_prima_qwen3_14b.py
          python -m py_compile evaluate_velnor_family.py grade_generations.py
      - name: Run dependency-free training contract tests
        working-directory: training
        run: python -m unittest discover -s tests -v
