name: Velnor IDE CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velnor-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build production Next.js bundle
        run: npm run build

      - name: Verify the IDE against a production server
        run: |
          nohup npm run start > server.log 2>&1 &
          SERVER_PID=$!
          VELNOR_URL=http://localhost:3000 npm run verify
          kill $SERVER_PID || true
          echo "--- server.log ---"
          tail -50 server.log

      - name: Build Cloudflare Worker with OpenNext
        run: npm run cf:build

      - name: Wrangler deploy dry-run (no upload)
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Smoke-test the Worker runtime
        run: |
          nohup npx wrangler dev --local --port 8787 > worker.log 2>&1 &
          WORKER_PID=$!
          VELNOR_URL=http://localhost:8787 npm run verify
          kill $WORKER_PID || true
          echo "--- worker.log ---"
          tail -80 worker.log

      - name: Deploy verified branch to separate Worker
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/deploy/cloudflare-ide' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report deployment skipped when credentials are absent
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/deploy/cloudflare-ide' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '')
        run: echo "Live deployment skipped; Cloudflare deployment secrets are not configured for this repository."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
