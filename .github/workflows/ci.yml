name: Velnor IDE CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: velnor-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build production Next.js standalone bundle
        run: npm run build

      - name: Verify the IDE against the standalone production server
        run: |
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -R public .next/standalone/public; fi
          PORT=3000 HOSTNAME=127.0.0.1 nohup node .next/standalone/server.js > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          npm run verify
          echo "--- server.log ---"
          tail -50 server.log

      - name: Build Node 26 Alpine Docker image
        run: docker build --tag velnor-ci:latest .

      - name: Smoke-test the Node 26 Alpine Docker image
        run: |
          docker run --detach --name velnor-ci --publish 8080:8080 velnor-ci:latest
          trap 'docker rm --force velnor-ci >/dev/null 2>&1 || true' EXIT
          VELNOR_URL=http://localhost:8080 npm run verify
          echo "--- container logs ---"
          docker logs --tail=50 velnor-ci
