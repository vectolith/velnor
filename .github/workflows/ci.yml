name: Olli Production CI (Build, Typecheck & E2E Verification)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Build production Next.js standalone bundle
        run: npm run build

      - name: Run End-to-End Verification Suite against production server
        run: |
          nohup npm run start > server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          node scripts/verify-olli.mjs
          kill $SERVER_PID || true
