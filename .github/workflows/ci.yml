name: Velnor IDE CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: velnor-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build production Next.js bundle
        run: npm run build
      - name: Verify the production server
        run: |
          PORT=3000 HOSTNAME=127.0.0.1 nohup npm run start -- -p 3000 > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          VELNOR_URL=http://localhost:3000 npm run verify
          echo "--- server.log ---"
          tail -50 server.log
      - name: Build Cloudflare Worker with OpenNext
        if: matrix.node-version == 26
        run: npm run cf:build
      - name: Wrangler deploy dry-run (no upload)
        if: matrix.node-version == 26
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: Smoke-test local Worker runtime
        if: matrix.node-version == 26
        run: |
          nohup npx wrangler dev --local --port 8787 > worker.log 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WORKER_PID" 2>/dev/null || true' EXIT
          VELNOR_URL=http://localhost:8787 npm run verify
          echo "--- worker.log ---"
          tail -80 worker.log
      - name: Build Node 26 Alpine Docker image
        if: matrix.node-version == 26
        run: docker build --tag velnor-ci:latest .
      - name: Smoke-test Docker image
        if: matrix.node-version == 26
        run: |
          docker run --detach --name velnor-ci --publish 8080:8080 velnor-ci:latest
          trap 'docker rm --force velnor-ci >/dev/null 2>&1 || true' EXIT
          VELNOR_URL=http://localhost:8080 npm run verify
          echo "--- container logs ---"
          docker logs --tail=50 velnor-ci
