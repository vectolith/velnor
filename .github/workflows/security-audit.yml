name: Dependency Security Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Audit dependencies for high and critical vulnerabilities
        run: npm audit --audit-level=high
