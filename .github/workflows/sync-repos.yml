name: Auto-Sync Repositories (ganiyucall911/Olli <-> pluco-dev/Olli)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to counterpart repository
        env:
          SYNC_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
          CURRENT_REPO: ${{ github.repository }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "Notice: Add a Personal Access Token named REPO_SYNC_TOKEN in Settings -> Secrets -> Actions to enable cloud-to-cloud GitHub Actions mirroring."
            exit 0
          fi

          if [ "$CURRENT_REPO" = "ganiyucall911/Olli" ]; then
            TARGET_REPO="pluco-dev/Olli"
          else
            TARGET_REPO="ganiyucall911/Olli"
          fi

          echo "Syncing $CURRENT_REPO -> $TARGET_REPO..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push --force "https://x-access-token:${SYNC_TOKEN}@github.com/${TARGET_REPO}.git" HEAD:refs/heads/main
