# Velnor on one Oracle Cloud VM.
#
# Caddy owns 80 and 443 and terminates TLS, because Slack only accepts an https
# request URL. The app itself stays bound to loopback, so the only way in is
# through Caddy; nothing on the internet can reach port 8080 directly.
#
# Compose reads .env in this directory for ${VELNOR_HOST} interpolation and passes
# the same file to the app. Caddy is given the hostname only: it has no reason to
# see the signing secret or the bot token.
name: velnor

services:
  velnor:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      # Without this every chat, reminder and sealed credential dies with the container.
      - velnor-data:/app/.data
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2-alpine
    depends_on:
      - velnor
    environment:
      VELNOR_HOST: ${VELNOR_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  velnor-data:
  caddy-data:
  caddy-config:
