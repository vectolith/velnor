name: velnor

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      VELNOR_DATA_DIR: /app/.data
    volumes:
      - velnor-data:/app/.data
    expose:
      - "8080"
    restart: unless-stopped
    init: true
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      VELNOR_HOST: ${VELNOR_HOST:?Set VELNOR_HOST to the public DNS hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    init: true

volumes:
  velnor-data:
  caddy-data:
  caddy-config:
